# Phase 1: how does a 7B instruct model behave across context lengths on one RTX 4090?
#
#   python -m src.benchmarks.run --config configs/qwen2.5-7b.yaml
#
# determinism is deliberately off here. Requesting deterministic algorithms disables
# cuDNN autotuning and can select slower kernels, which would make the throughput
# numbers a measurement of the determinism setting rather than of the model. Greedy
# decoding already makes the generated text reproducible; see docs/methodology.md.

experiment:
  name: phase1_context_sweep
  seed: 1234
  output_root: results
  deterministic: false
  notes: >
    Context-length sweep at bf16. 16384 is included to probe where the KV cache and
    attention cost start to bite; it is within the model's 32768-token limit.

model:
  id: Qwen/Qwen2.5-7B-Instruct
  revision: main
  local_path: models/Qwen2.5-7B-Instruct
  attn_implementation: sdpa

benchmark:
  precisions: [bf16]
  context_lengths: [128, 512, 2048, 8192, 16384]
  max_new_tokens: 128
  repeats: 3
  warmup: 1
  batch_size: 1

monitoring:
  enabled: true
  sample_interval_s: 0.05
