# Phase 7 A/B arm: decode attention = sdpa_no_gqa. Identical to configs/qwen2.5-7b.yaml apart
# from the backend, the finer context grid and the experiment name.
#
#   python -m src.benchmarks.run --config configs/decode_ab_sdpa_no_gqa.yaml

experiment:
  name: phase7_decode_attention_ab
  seed: 1234
  output_root: results
  deterministic: false
  notes: >
    A/B arm: sdpa_no_gqa.
    Context-length sweep at bf16. 16384 is included to probe where the KV cache and
    attention cost start to bite; it is within the model's 32768-token limit.

model:
  id: Qwen/Qwen2.5-7B-Instruct
  revision: main
  local_path: models/Qwen2.5-7B-Instruct
  attn_implementation: sdpa_no_gqa

benchmark:
  precisions: [bf16]
  context_lengths: [128, 512, 1024, 2048, 4096, 8192, 16384]
  max_new_tokens: 128
  repeats: 3
  warmup: 1
  batch_size: 1

monitoring:
  enabled: true
  sample_interval_s: 0.05
