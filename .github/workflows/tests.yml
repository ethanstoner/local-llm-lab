name: tests

on:
  push:
  pull_request:

jobs:
  cpu:
    # The suite is CPU-only and network-free by design; GPU tests carry the `gpu`
    # marker and skip themselves when no CUDA device is present.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU torch and the pinned stack
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.0 accelerate==1.12.0 safetensors==0.7.0 \
            "huggingface_hub>=0.34.0,<1.0" datasets==4.5.0 numpy==2.2.6 pandas==2.3.3 \
            matplotlib==3.10.7 pyyaml==6.0.2 nvidia-ml-py pytest ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q -m "not gpu"
